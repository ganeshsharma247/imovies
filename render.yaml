services:
  - type: web
    name: imovies-cinema-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_MEMORY_DB_FALLBACK
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEAT_HOLD_DURATION_MINUTES
        value: 10
      - key: CLIENT_URL
        value: https://imovies-cinema-platform.onrender.com
      - key: AUTO_SEED_IF_EMPTY
        value: true
